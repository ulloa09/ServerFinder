name: Release

# Pushing a tag like v1.0.0 builds ServerFinder.dmg and attaches it to a draft release.
# Review the notes on GitHub, then publish the draft.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number is the commit count
      - name: Run tests
        run: scripts/test.sh --disable-xctest # there are only Swift Testing tests
      - name: Build the disk image
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ServerFinder.dmg build/ServerFinder.dmg.sha256 \
            --draft --title "ServerFinder ${GITHUB_REF_NAME#v}" --generate-notes
